<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244a36">
  <meta name="description" content="ខគម្ពីរសម្រាប់ចងចាំប្រចាំសប្ដាហ៍របស់ព្រះវិហារ Living Fields។">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=2">
  <title>ព្រះវិហារ Living Fields — ខគម្ពីរសម្រាប់ចងចាំ</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="living-fields-logo.png" alt="Living Fields Church" class="logo">
    <div class="church-name">
      <span class="brand-title">LIVING FIELDS</span>
      <small>ខគម្ពីរសម្រាប់ចងចាំ</small>
    </div>
  </div>

<button id="shareAppBtn" class="share-icon" aria-label="Share app">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="18" cy="5" r="2"></circle>
    <circle cx="6" cy="12" r="2"></circle>
    <circle cx="18" cy="19" r="2"></circle>
    <line x1="8" y1="12" x2="16" y2="6"></line>
    <line x1="8" y1="12" x2="16" y2="18"></line>
  </svg>
</button>

  <button id="installBtn" class="install">ដំឡើងកម្មវិធី</button>
</header>

<main>
    <section class="hero">
      <p class="eyebrow" id="weekLabel">ព្រះវិហារ LIVING FIELDS · សប្ដាហ៍នេះ</p>
      <h1 id="title">ខគម្ពីរសម្រាប់ចងចាំ</h1>
      <p class="topic" id="topic"></p>
      <blockquote id="verse"></blockquote>
      <p class="reference" id="reference"></p>
     <div class="verse-actions">
  <button id="questionsBtn" class="primary">សំណួរអំពីខគម្ពីរ</button>
  <button id="reminderBtn" class="primary">បើកការរំលឹកប្រចាំថ្ងៃ</button>
</div>
      
    </section>

    <section class="quick">
  <button id="prevBtn">← មុន</button>
  <button id="todayBtn">សប្ដាហ៍នេះ</button>
  <button id="nextBtn">បន្ទាប់ →</button>
</section>

    <section class="history">
      <div class="section-head">
        <div>
          <p class="eyebrow">បណ្ណាល័យខគម្ពីរ</p>
          <h2>ខគម្ពីរមុនៗ</h2>
        </div>
        <input id="search" type="search" placeholder="ស្វែងរកខគម្ពីរ…" aria-label="ស្វែងរកខគម្ពីរ">
      </div>
      <div id="list"></div>
    </section>
  </main>

  <footer>
    <span>ខគម្ពីរសម្រាប់ចងចាំប្រចាំសប្ដាហ៍</span>
    <span>•</span>
    <span id="year"></span>
  </footer>

<script src="verses.js"></script>
<script>
const $ = id => document.getElementById(id);
let currentIndex = 0;
let deferredPrompt = null;

function dayOfYear(month, day, year) {
  return Math.floor((new Date(year, month - 1, day) - new Date(year, 0, 0)) / 86400000);
}

function currentIndexForToday() {
  const now = new Date();
  const target = dayOfYear(now.getMonth()+1, now.getDate(), now.getFullYear());
  let best = 0, bestDiff = Infinity;
  VERSES.forEach((v, i) => {
    const d = dayOfYear(v.month, v.day, now.getFullYear());
    let diff = target - d;
    if (diff < 0) diff += 365 + (new Date(now.getFullYear(), 1, 29).getMonth() === 1 ? 1 : 0);
    if (diff < bestDiff) { bestDiff = diff; best = i; }
  });
  return best;
}

function display(i) {
  currentIndex = (i + VERSES.length) % VERSES.length;
  const v = VERSES[currentIndex];
  const now = new Date();
  const date = new Date(now.getFullYear(), v.month - 1, v.day);
  $("weekLabel").textContent = currentIndex === currentIndexForToday() ? "សប្ដាហ៍នេះ" : "ខគម្ពីរសម្រាប់ចងចាំ";
  $("title").textContent = v.title.replace(/^I\.\s+|^II\.\s+|^III\.\s+|^IV\.\s+|^V\.\s+/, "");
  const pieces = v.title.split(":");
  $("topic").textContent = v.title.replace(/^[IVX]+\.\s*/, "").trim();  
const reference = referenceFromVerse(v.verse);
$("verse").textContent = reference
  ? v.verse.slice(0, v.verse.lastIndexOf(reference)).trim()
  : v.verse;
  $("reference").textContent = reference;
  $("questionsBtn").onclick = () => showQuestions(v);
  renderList();
  window.scrollTo({top:0, behavior:"smooth"});
}
function referenceFromVerse(verse) {
  const match = verse.match(
    /(?:[១២៣]\s*)?[\u1780-\u17FF]+(?:\s+[\u1780-\u17FF]+)*\s+\d+(?::\s?\d+(?:[-,]\s?\d+)*)?$/
  );
  return match ? match[0] : "";
}
function renderList() {
  const q = $("search").value.toLowerCase().trim();

  const khmerMonths = [
    "មករា", "កុម្ភៈ", "មីនា", "មេសា",
    "ឧសភា", "មិថុនា", "កក្កដា", "សីហា",
    "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"
  ];

  $("list").innerHTML = VERSES.map((v,i) => ({v,i}))
    .filter(x => !q || JSON.stringify(x.v).toLowerCase().includes(q))
    .map(({v,i}) => {
      const active = i === currentIndex ? " active" : "";
      const date = `${khmerMonths[v.month - 1]} ${v.day}`;

      return `<button class="verse-row${active}" onclick="display(${i})">
        <span class="date">${date}</span>
        <span class="row-main"><strong>${escapeHtml(v.title.split(":").pop().trim())}</strong><small>${escapeHtml(v.verse)}</small></span>
      </button>`;
    }).join("");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

async function shareVerse(v) {
  const text = `${v.verse}\n${referenceFromVerse(v.verse)}`;
  if (navigator.share) {
    await navigator.share({title:"Bible Memory Verse", text});
  } else {
    await navigator.clipboard.writeText(text);
  }
}

async function shareApp() {
  const url = "https://livingfieldschurch.github.io/bibleverse/";

  if (navigator.share) {
    await navigator.share({
      title: "Living Fields Bible Memory",
      text: "Check out Living Fields Bible Memory",
      url
    });
  } else {
    await navigator.clipboard.writeText(url);
    alert("App link copied!");
  }
}

function showQuestions(v) {
  const questions = v.questions || [];

  alert(
    "Bible Verse Questions\n\n" +
    questions.map((q, i) => `${i + 1}. ${q}`).join("\n\n")
  );
}

$("prevBtn").onclick = () => display(currentIndex - 1);
$("nextBtn").onclick = () => display(currentIndex + 1);

$("shareAppBtn").onclick = () => shareApp();

$("reminderBtn").onclick = async () => {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      alert("Push notifications are not supported in this browser.");
      return;
    }

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      alert("Notifications were not enabled.");
      return;
    }

    const registration = await navigator.serviceWorker.ready;

    const keyResponse = await fetch(
  "https://living-fields-reminders-app.livingfields.workers.dev/vapid-public-key"
);

    const { publicKey } = await keyResponse.json();

    const applicationServerKey = urlBase64ToUint8Array(publicKey);

    let subscription =
      await registration.pushManager.getSubscription();

    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey
      });
    }

    const saveResponse = await fetch(
      "https://living-fields-reminders-app.livingfields.workers.dev/subscribe",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(subscription)
      }
    );

    const result = await saveResponse.json();

    if (!result.ok) {
      throw new Error(result.error || "Could not save subscription.");
    }

    $("reminderBtn").textContent = "Daily reminders enabled ✓";
    $("reminderBtn").disabled = true;

  } catch (error) {
    console.error(error);
alert("Reminder error: " + error.message);
  }
};
let deferredInstallPrompt = null;

const installBtn = $("installBtn");

// Hide the button when the site is already running as an installed app
const isInstalled =
  window.matchMedia("(display-mode: standalone)").matches ||
  window.navigator.standalone === true;

if (isInstalled) {
  installBtn.style.display = "none";
}

// Save the browser's install prompt when available
window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
});

installBtn.addEventListener("click", async () => {
  // If the browser supports its own install prompt
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();

    const choice = await deferredInstallPrompt.userChoice;

    if (choice.outcome === "accepted") {
      installBtn.style.display = "none";
    }

    deferredInstallPrompt = null;
    return;
  }

  // Instructions for iPhone/iPad and browsers without an install prompt
  alert(
    "To install Living Fields Bible Memory:\n\n" +
    "iPhone/iPad:\n" +
    "1. Open this page in Safari.\n" +
    "2. Tap the Share button.\n" +
    "3. Choose 'Add to Home Screen'.\n" +
    "4. Tap 'Add'.\n\n" +
    "Other devices:\n" +
    "Open your browser menu and choose 'Install app' or 'Add to Home Screen'."
  );
});

// Hide the button if the browser reports that installation completed
window.addEventListener("appinstalled", () => {
  installBtn.style.display = "none";
});

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat(
    (4 - (base64String.length % 4)) % 4
  );

  const base64 = (base64String + padding)
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  const rawData = atob(base64);

  return Uint8Array.from(
    [...rawData].map(character => character.charCodeAt(0))
  );
}
  
$("todayBtn").onclick = () => display(currentIndexForToday());
$("search").oninput = renderList;
$("year").textContent = new Date().getFullYear();

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e; $("installBtn").classList.remove("hidden");
});
$("installBtn").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt = null;
  $("installBtn").classList.add("hidden");
};

display(currentIndexForToday());

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
